<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>構造力学研究室 News Uploader</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; }
    .input-field {
      width: 100%; padding: 0.5rem; background-color: #1e293b; border: 1px solid #334155; 
      border-radius: 0.375rem; color: #f8fafc; outline: none; transition: border-color 0.2s;
    }
    .input-field:focus { border-color: #38bdf8; }
    .loader {
      border: 3px solid rgba(255, 255, 255, 0.3); border-radius: 50%;
      border-top: 3px solid #ffffff; width: 20px; height: 20px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="min-h-screen p-4 md:p-6 font-sans">
  <div class="max-w-2xl mx-auto bg-[#1e293b] p-6 rounded-lg shadow-xl border border-slate-700">
    <h1 class="text-xl md:text-2xl font-bold mb-4 text-sky-400 border-b border-slate-600 pb-3">News 記事アップローダー</h1>
    <p class="text-slate-400 text-xs md:text-sm mb-6">
      Hugoの <code>content/news/</code> ディレクトリに自動で構成（Front Matter）を整えてアップロードします。<br>
      ※リポジトリは <code>ko727/cstpme-ohtsukalab.github.io</code> に固定されています。
    </p>

    <div class="space-y-5">
      <!-- 認証情報 -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">GitHub Token (ghp_...)</label>
        <input type="password" id="github-token" class="input-field" placeholder="ghp_xxxxxxxxxxxx">
      </div>

      <!-- 記事情報（日付・タイトル） -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">日付 (YYYY-MM-DD)</label>
          <!-- スマホでカレンダー入力が出やすいように type="date" にしています -->
          <input type="date" id="article-date" class="input-field">
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-300 mb-1">タイトル (A)</label>
          <input type="text" id="article-title" class="input-field" placeholder="例: 学会発表を行いました">
        </div>
      </div>

      <!-- フォルダ名設定 -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">フォルダ名 (半角英数字・ハイフンのみ)</label>
        <input type="text" id="article-dirname" class="input-field text-sm" placeholder="例: 2026-10-16-conference">
        <p class="text-xs text-slate-500 mt-1">※この名前で <code>content/news/フォルダ名/</code> が作成されます。</p>
      </div>

      <!-- 記事本文 -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">記事本文 (B)</label>
        <textarea id="article-body" class="input-field h-40 md:h-64 text-sm" placeholder="ここに本文を記述します。改行もそのまま反映されます。"></textarea>
      </div>

      <!-- 画像アップロード -->
      <div>
        <label class="block text-sm font-medium text-slate-300 mb-1">写真 / 画像 (任意) → <code>featured.jpg</code></label>
        <!-- スマホでのファイル選択（カメラ起動含む）に対応 -->
        <input type="file" id="image-file" accept="image/jpeg, image/png, image/webp" class="input-field text-sm file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-sky-500 file:text-white hover:file:bg-sky-600">
        <p class="text-xs text-slate-500 mt-1">※画像を選択した場合、本文の最後に自動で <code>![Picture](featured.jpg)</code> が追加されます。</p>
      </div>

      <!-- ボタン -->
      <button id="upload-btn" onclick="handleUpload()" class="w-full bg-sky-500 hover:bg-sky-600 text-white font-bold py-3 px-4 rounded transition-colors mt-4 text-sm md:text-base">
        <span id="btn-text">作成してアップロード</span>
        <span id="btn-loader" class="loader hidden ml-2"></span>
      </button>

      <!-- メッセージボックス -->
      <div id="message-box" class="hidden mt-4 p-4 rounded text-sm break-words"></div>
    </div>
  </div>

  <script>
    // リポジトリ名を固定
    const REPO_NAME = "ko727/cstpme-ohtsukalab.github.io";

    // ページ読み込み時に今日の日付をセット
    window.onload = function() {
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('article-date').value = `${yyyy}-${mm}-${dd}`;
    };

    function encodeBase64Unicode(str) {
      return btoa(encodeURIComponent(str).replace(/%([0-9A-F]{2})/g,
        function toSolidBytes(match, p1) {
          return String.fromCharCode('0x' + p1);
      }));
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => {
          const base64String = reader.result.replace(/^data:image\/[a-z]+;base64,/, "");
          resolve(base64String);
        };
        reader.onerror = error => reject(error);
      });
    }

    async function uploadToGitHubAPI(token, filePath, base64Content, commitMessage) {
      const url = `https://api.github.com/repos/${REPO_NAME}/contents/${filePath}`;
      const response = await fetch(url, {
        method: 'PUT',
        headers: {
          'Authorization': `token ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: commitMessage,
          content: base64Content
        })
      });

      if (!response.ok) {
        const errData = await response.json();
        throw new Error(`${filePath} の保存に失敗: ${errData.message}`);
      }
      return response.json();
    }

    async function handleUpload() {
      const token = document.getElementById('github-token').value.trim();
      const dateVal = document.getElementById('article-date').value;
      const title = document.getElementById('article-title').value.trim();
      const dirName = document.getElementById('article-dirname').value.trim();
      const bodyText = document.getElementById('article-body').value;
      const imageInput = document.getElementById('image-file');
      
      const btn = document.getElementById('upload-btn');
      const btnText = document.getElementById('btn-text');
      const btnLoader = document.getElementById('btn-loader');
      const msgBox = document.getElementById('message-box');

      // 必須項目のチェック
      if (!token || !dateVal || !title || !dirName || !bodyText) {
        showMessage("エラー: 画像以外のすべての項目を入力してください。", "error");
        return;
      }

      btn.disabled = true;
      btn.classList.replace('bg-sky-500', 'bg-slate-600');
      btnText.innerText = "通信中...";
      btnLoader.classList.remove('hidden');
      msgBox.classList.add('hidden');

      try {
        const basePath = `content/news/${dirName}`;
        let successMessage = "";
        const hasImage = imageInput.files.length > 0;

        // Front Matter（メタデータ）の構築
        let markdownContent = `---
title: "${title}"
date: ${dateVal}
draft: false
share: false

image:
  preview_only: true
---

${bodyText}`;

        // 画像がある場合は本文の末尾にMarkdownの画像記法を追加
        if (hasImage) {
          markdownContent += `\n\n![Picture](featured.jpg)`;
        }

        // 1. index.mdのアップロード
        const mdBase64 = encodeBase64Unicode(markdownContent);
        await uploadToGitHubAPI(token, `${basePath}/index.md`, mdBase64, `Add news article: ${title}`);
        successMessage += `✅ 記事 (${basePath}/index.md) を作成しました。<br>`;

        // 2. 画像のアップロード (選択されている場合のみ)
        if (hasImage) {
          const file = imageInput.files[0];
          const imgBase64 = await fileToBase64(file);
          await uploadToGitHubAPI(token, `${basePath}/featured.jpg`, imgBase64, `Add image for ${title}`);
          successMessage += `✅ 画像 (${basePath}/featured.jpg) を作成しました。<br>`;
        }

        showMessage(successMessage + "<br><b>🎉 アップロード成功！約1〜2分後にサイトに反映されます。</b>", "success");
        
        // 成功したら入力欄をリセット (Tokenは残す)
        document.getElementById('article-title').value = '';
        document.getElementById('article-dirname').value = '';
        document.getElementById('article-body').value = '';
        imageInput.value = '';

      } catch (error) {
        showMessage("エラー発生: " + error.message, "error");
      } finally {
        btn.disabled = false;
        btn.classList.replace('bg-slate-600', 'bg-sky-500');
        btnText.innerText = "作成してアップロード";
        btnLoader.classList.add('hidden');
      }
    }

    function showMessage(msg, type) {
      const msgBox = document.getElementById('message-box');
      msgBox.classList.remove('hidden', 'bg-red-900/50', 'text-red-300', 'border-red-800', 'bg-emerald-900/50', 'text-emerald-300', 'border-emerald-800');
      
      if (type === "error") {
        msgBox.classList.add('bg-red-900/50', 'text-red-300', 'border', 'border-red-800');
      } else {
        msgBox.classList.add('bg-emerald-900/50', 'text-emerald-300', 'border', 'border-emerald-800');
      }
      msgBox.innerHTML = msg;
    }
  </script>
</body>
</html>
