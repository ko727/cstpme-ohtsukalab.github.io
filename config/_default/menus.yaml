# Navigation Links
#   To link a homepage widget, specify the URL as a hash `#` followed by the filename of the
#     desired widget in your `content/home/` folder.
#   The weight parameter defines the order that the links will appear in.

main:
  - name: About
    url: '/about/'     # 独立したページへのリンク（/ で囲む）
    weight: 10
  - name: Research
    url: '/research/'  # 独立したページへのリンク[cite: 1]
    weight: 20
  - name: Member
    url: '/member/'    # 独立したページへのリンク[cite: 1]
    weight: 30
  - name: News
    url: '/news/'
    weight: 40
